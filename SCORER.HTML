<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06111f">

    <title>CRICKET_SCORE_MASTER — Create New Match</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* =========================================================
           CREATE NEW MATCH — COMPACT & POLISHED
           ========================================================= */

        html {
            min-height: 100%;
            background: #06111f;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            background:
                linear-gradient(rgba(2, 10, 20, .62), rgba(2, 10, 20, .72)),
                url('assets/bg.jpg') center center / cover fixed no-repeat;
            overflow-x: hidden;
        }

        /* Full-page background stays continuous */
        .hero {
            min-height: 0 !important;
            height: auto !important;
            padding: 22px 16px 34px;
            box-sizing: border-box;
            background: transparent !important;
        }

        .hero-overlay {
            width: min(1180px, 100%);
            min-height: 0 !important;
            height: auto !important;
            margin: 0 auto;
            padding: 22px;
            box-sizing: border-box;

            background: rgba(3, 17, 31, .72) !important;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 22px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
            backdrop-filter: blur(3px);
        }

        /* Navbar */
        .navbar {
            min-height: 68px;
            padding: 12px 40px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            flex-wrap: wrap;

            background: rgba(3, 13, 26, .94) !important;
            border-bottom: 1px solid rgba(255, 255, 255, .10);
        }

        .logo {
            color: var(--primary-color, #9dfc05);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .menu {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .menu li {
            list-style: none;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .4px;
        }

        .menu a {
            color: #fff;
            text-decoration: none;
            transition: color .2s ease;
        }

        .menu a:hover {
            color: var(--primary-color, #9dfc05) !important;
        }

        .menu .active {
            color: var(--primary-color, #9dfc05);
        }

        /* All content blocks size themselves to their content */
        #step1,
        #step2,
        .info-card,
        .overview-grid {
            height: auto !important;
            min-height: 0 !important;
            box-sizing: border-box;
        }

        #step2 {
            margin-top: 20px;
        }

        /* Section cards */
        .info-card {
            padding: 18px;
            margin: 0;
            border-radius: 15px;
            background: rgba(4, 18, 32, .90) !important;
            border: 1px solid rgba(157, 252, 5, .16);
            box-shadow: 0 8px 25px rgba(0, 0, 0, .18);
        }

        .info-card h3 {
            margin: 0 0 14px;
            color: var(--primary-color, #9dfc05);
            font-size: 18px;
            line-height: 1.3;
            font-weight: 700;
        }

        /* Step 1 match details */
        #step1 > .info-card:first-child {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px 14px;
            align-items: center;
        }

        #step1 > .info-card:first-child h3 {
            grid-column: 1 / -1;
            margin-bottom: 2px;
        }

        #step1 > .info-card:first-child label {
            margin-top: 2px;
        }

        input,
        select {
            width: 100%;
            min-height: 42px;
            padding: 9px 12px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 9px;
            outline: none;
            background: rgba(7, 24, 39, .95);
            color: #fff;
            font: inherit;
            font-size: 14px;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        input:focus,
        select:focus {
            border-color: var(--primary-color, #9dfc05);
            box-shadow: 0 0 0 3px rgba(157, 252, 5, .10);
        }

        input::placeholder {
            color: rgba(255, 255, 255, .48);
        }

        /* Playing XI */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            align-items: start;
        }

        #team1Players,
        #team2Players {
            display: grid;
            gap: 8px;
        }

        /* Generated player inputs/selects inherit the same compact style */
        #team1Players input,
        #team2Players input,
        #team1Players select,
        #team2Players select {
            margin: 0;
        }

        /* Buttons */
        .tab-btn {
            min-width: 150px;
            min-height: 42px;
            padding: 9px 22px;
            border: 0;
            border-radius: 24px;
            background: var(--primary-color, #9dfc05);
            color: #07120a;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
        }

        .tab-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 20px rgba(157, 252, 5, .22);
            filter: brightness(1.04);
        }

        .tab-btn:active {
            transform: translateY(0);
        }

        #nextBtn,
        #finalBtn {
            min-width: 190px;
        }

        /* Step 2 selection layout */
        #step2 > .overview-grid:first-child {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        #step2 > .overview-grid:first-child .info-card {
            min-height: 0;
        }

        #battingTeamBtns {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        #battingTeamBtns button {
            min-width: 140px;
            padding: 9px 18px;
            border-radius: 22px;
        }

        #strikerDiv,
        #nonStrikerDiv,
        #bowlerDiv,
        #team1Captain,
        #team1WK,
        #team2Captain,
        #team2WK {
            width: 100%;
        }

        /* Keep error messages compact when empty */
        #errorMessage,
        #step2Error {
            min-height: 0;
            margin-bottom: 0;
        }

        /* Prevent empty generated containers from adding space */
        #team1Players:empty,
        #team2Players:empty,
        #team1Captain:empty,
        #team1WK:empty,
        #team2Captain:empty,
        #team2WK:empty,
        #battingTeamBtns:empty,
        #strikerDiv:empty,
        #nonStrikerDiv:empty,
        #bowlerDiv:empty {
            display: none;
        }

        /* Mobile */
        @media (max-width: 900px) {
            .navbar {
                padding: 10px 18px;
            }

            .logo {
                width: 100%;
                text-align: center;
            }

            .menu {
                width: 100%;
            }

            .hero {
                padding: 12px 10px 24px;
            }

            .hero-overlay {
                padding: 14px;
                border-radius: 16px;
            }

            #step1 > .info-card:first-child {
                grid-template-columns: 1fr 1fr;
            }

            .overview-grid,
            #step2 > .overview-grid:first-child {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            body {
                background-attachment: scroll;
            }

            .navbar {
                gap: 8px;
            }

            .menu {
                gap: 12px;
            }

            .menu li {
                font-size: 13px;
            }

            .hero {
                padding: 8px 6px 18px;
            }

            .hero-overlay {
                padding: 10px;
                border-radius: 13px;
                background: rgba(3, 17, 31, .78) !important;
            }

            .info-card {
                padding: 14px;
                border-radius: 12px;
            }

            #step1 > .info-card:first-child,
            .overview-grid,
            #step2 > .overview-grid:first-child {
                grid-template-columns: 1fr;
            }

            .info-card h3 {
                font-size: 16px;
            }

            .tab-btn,
            #nextBtn,
            #finalBtn {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🏏 CRICKET_SCORE_MASTER
        </div>

        <ul class="menu">
            <li>
                <a href="index.html">
                    HOME
                </a>
            </li>

            <li class="active">
                CREATE NEW MATCH
            </li>
        </ul>

    </header>

    <main class="hero">

        <div class="hero-overlay">

            <!-- STEP 1 -->
            <section id="step1">

                <div class="info-card">

                    <h3>Create Match</h3>

                    <label for="matchName" style="color:#9dfc05;">
                        Match Name
                    </label>
                    <input type="text" id="matchName" autocomplete="off">

                    <label for="team1Name" style="color:#9dfc05;">
                        Team 1 Name
                    </label>
                    <input type="text" id="team1Name" autocomplete="off">

                    <label for="team2Name" style="color:#9dfc05;">
                        Team 2 Name
                    </label>
                    <input type="text" id="team2Name" autocomplete="off">

                    <label for="overs" style="color:#9dfc05;">
                        Overs Per Innings
                    </label>
                    <input type="number" id="overs" min="1">

                </div>

                <div class="overview-grid" style="margin-top:18px;">

                    <div class="info-card">

                        <h3 id="team1Title">
                            Team 1 Playing XI
                        </h3>

                        <div id="team1Players"></div>

                    </div>

                    <div class="info-card">

                        <h3 id="team2Title">
                            Team 2 Playing XI
                        </h3>

                        <div id="team2Players"></div>

                    </div>

                </div>

                <div style="margin-top:18px; text-align:center;">
                    <button class="tab-btn" id="nextBtn" type="button">
                        NEXT
                    </button>
                </div>

                <p id="errorMessage" style="color:#ff4d4d; text-align:center; margin-top:9px;"></p>

            </section>

            <!-- STEP 2 -->
            <section id="step2" style="display:none;">

                <div class="overview-grid">

                    <div class="info-card">
                        <h3>Team 1 Captain</h3>
                        <div id="team1Captain"></div>
                    </div>

                    <div class="info-card">
                        <h3>Team 1 Wicket Keeper</h3>
                        <div id="team1WK"></div>
                    </div>

                    <div class="info-card">
                        <h3>Team 2 Captain</h3>
                        <div id="team2Captain"></div>
                    </div>

                    <div class="info-card">
                        <h3>Team 2 Wicket Keeper</h3>
                        <div id="team2WK"></div>
                    </div>

                </div>

                <div class="info-card" style="margin-top:18px;">

                    <h3>Who Will Bat First?</h3>

                    <div id="battingTeamBtns"></div>

                </div>

                <div class="overview-grid" style="margin-top:18px;">

                    <div class="info-card">
                        <h3>Striker</h3>
                        <div id="strikerDiv"></div>
                    </div>

                    <div class="info-card">
                        <h3>Non-Striker</h3>
                        <div id="nonStrikerDiv"></div>
                    </div>

                </div>

                <div class="info-card" style="margin-top:18px;">

                    <h3>First Bowler</h3>

                    <div id="bowlerDiv"></div>

                </div>

                <div style="text-align:center; margin-top:18px;">

                    <button class="tab-btn" id="finalBtn" type="button">
                        START MATCH
                    </button>

                </div>

                <p id="step2Error" style="color:#ff4d4d; text-align:center; margin-top:9px;"></p>

            </section>

        </div>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
